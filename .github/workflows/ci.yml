name: ci 
on:
  push:
    branches: 
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.8
      - run: pip install mkdocs-material # TODO - fix the version to avoid breaking changes
      - run: pip install mkdocs-git-revision-date-localized-plugin # TODO - fix the version to avoid breaking changes
      - run: pip install mkdocs-static-i18n # TODO - fix the version to avoid breaking changes
      - run: mkdocs gh-deploy --force
 
